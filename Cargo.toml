[package]
name = "lau-representation-theory"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Representation theory of finite groups — characters, irreducibles, induced representations, Young tableaux, and agent symmetry analysis"
repository = "https://github.com/SuperInstance/lau-representation-theory"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
num-complex = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
